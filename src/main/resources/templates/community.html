<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{community.title})}"></head>
<body>
    <div th:replace="~{fragments/loader}"></div>
    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div class="page">
        <header class="site-header" th:replace="~{fragments/nav :: nav(active='community')}"></header>

        <h1 th:text="#{community.title}">Community.</h1>

        <!-- Fork: Activity | People (People comes first on phones, see static/community-people.css). -->
        <div class="grid community-grid">
            <section id="communityFeed" class="community-activity" aria-labelledby="communityActivityTitle">
                <h2 id="communityActivityTitle" th:text="#{community.activity.title}">Activity</h2>
                <div th:if="${feed == null or #lists.isEmpty(feed)}" class="empty-state" th:text="#{community.empty}">No posts yet.</div>
                <div th:unless="${feed == null or #lists.isEmpty(feed)}">
                    <div th:each="item : ${feed}">
                        <div class="flex gap separate">
                            <div class="flex gap">
                                <div class="avatar sm" th:text="${#strings.toUpperCase(#strings.substring(item.username, 0, 1))}">U</div>
                                <div>
                                    <span class="username" th:text="${item.username}"></span>
                                    <br>
                                    <a th:href="${item.mediaType == 'movie'} ? @{'/movie/' + ${item.tmdbId}} : @{'/tv/' + ${item.tmdbId}}">
                                        <h4 th:text="${item.title}">Title</h4>
                                    </a>
                                    <span class="season" th:if="${item.seasonNumber != null}" th:text="#{tvshows.season.prefix} + ${item.seasonNumber}">S1</span>
                                </div>
                            </div>
                            <span class="date" th:text="${item.ratedAt}">date</span>
                        </div>
                        <div class="rating-detail-footer" th:if="${item.reviewText != null}" style="cursor: pointer;"
                             data-open-modal="reviewDetailModal"
                             th:data-review-title="${item.reviewTitle}"
                             th:data-review-text="${item.reviewText}">
                            <div class="separator"></div>
                            <h4 th:if="${item.reviewTitle != null}" th:text="${item.reviewTitle}"></h4>
                            <p class="t-long" th:text="${item.reviewTextPreview}">Review preview</p>
                        </div>
                        <div class="flex separate">
                            <span></span>
                            <span class="rating sm" th:text="${#strings.replace(#numbers.formatDecimal(item.score, 1, 2), ',', '.')}">0.00</span>
                        </div>
                        <div class="separator"></div>
                    </div>
                    <div>
                        <a th:href="@{/community(limit=${limit + 10})}" class="link flex gap">
                            <i data-lucide="chevrons-down"></i>
                            <span th:text="#{community.load.more}">Load More</span>
                        </a>
                    </div>
                </div>
            </section>
            <!-- Fork: People directory with Follow / Following buttons (replaces the search box + followed list). -->
            <aside class="community-side">
                <section th:replace="~{fragments/community-people :: people(${communityPeople}, @{/community(limit=${limit})})}"></section>
            </aside>
        </div>
    </div>
    <div th:replace="~{fragments/review-detail-modal :: reviewDetailModal}"></div>
    <link rel="stylesheet" href="/follow.css">
    <link rel="stylesheet" href="/community-people.css">
    <script src="/usersearch.js" defer></script>
    <script src="/confirm.js" defer></script>
    <script src="/follow-button.js" defer></script>
</body>
</html>
