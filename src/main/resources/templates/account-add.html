<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{account.add.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='account-add')}"></header>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${createdUsername}" class="feedback success" th:text="#{account.add.success(${createdUsername})}"></div>

    <h1 th:text="#{account.add.title}">Add account</h1>
    <p class="help-text" th:text="#{account.add.description}">
        Create an account for someone new. They sign in with this username and password.
    </p>

    <section class="card">
        <form th:action="@{/accounts/new}" method="post" class="account-add-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="accountUsername" th:text="#{admin.user.username}">Username</label>
                <input type="text" id="accountUsername" name="username" required minlength="3" maxlength="50" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="accountEmail" th:text="#{admin.user.email}">Email</label>
                <input type="email" id="accountEmail" name="email" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="accountPassword" th:text="#{admin.user.password}">Password</label>
                <input type="password" id="accountPassword" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
                <p class="help-text" th:text="#{account.add.password.help}">At least 8 characters.</p>
            </div>

            <button type="submit" class="primary w-100" th:text="#{account.add.submit}">Create account</button>
        </form>
    </section>
</div>
</body>
</html>
