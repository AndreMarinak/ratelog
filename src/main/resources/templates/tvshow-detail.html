<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{tvshow.detail.title})}"></head>
<body>
    <div th:replace="~{fragments/loader}"></div>
    <div class="page">
        <header class="site-header" th:replace="~{fragments/nav :: nav(active='tvshows')}"></header>

        <h1>
            <span th:text="${show != null} ? ${show.name} : #{tvshow.detail.not.found}">Loading TV show...</span>
            <span th:if="${show != null && show.firstAirYear != null}" class="year" th:text="${show.firstAirYear}">Year</span>
        </h1>

        <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
        <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

        <!-- Fork layout: poster column on the left, everything about the show in the column beside it. -->
        <div class="title-layout">
            <aside class="title-aside">
                <img class="detail" th:src="@{'https://image.tmdb.org/t/p/w500' + ${show.posterPath}}" th:srcset="|https://image.tmdb.org/t/p/w500${show.posterPath} 1x, https://image.tmdb.org/t/p/w780${show.posterPath} 2x|" th:alt="'Poster of ' + ${show.name}">
                <div class="title-providers" th:if="${watchProviders != null and !#lists.isEmpty(watchProviders.flatrate)}">
                    <span class="title-section-label" th:text="#{title.layout.where.to.watch}">Where to watch</span>
                    <div class="flex wrap gap">
                        <a th:each="provider : ${watchProviders.flatrate}"
                           class="watch-provider"
                           th:href="${watchProviders.link != null} ? ${watchProviders.link.value} : null"
                           th:title="${provider.name.value}"
                           target="_blank" rel="noopener noreferrer">
                            <img th:src="@{'https://image.tmdb.org/t/p/w92' + ${provider.logoPath.value}}" th:alt="${provider.name.value}" loading="lazy" />
                        </a>
                    </div>
                </div>
            </aside>

            <div class="title-main">
                <div class="flex gap-lg separate">
                    <p class="title-overview" th:text="${show.overview != null and show.overview.trim().length() > 0} ? ${show.overview} : #{tvshow.detail.no.synopsis}">Loading TV show information.</p>
                    <span th:if="${show.overallScore != null}" class="rating" th:text="${#strings.replace(#numbers.formatDecimal(show.overallScore, 1, 2), ',', '.')}">0.00</span>
                </div>
                <div class="flex gap-lg separate centered wrap">
                    <div th:if="${!#lists.isEmpty(show.genres)}" class="flex gap wrap">
                        <span class="tag" th:each="genreId : ${show.genres}" th:text="#{${'genre.' + genreId}}">Genre</span>
                    </div>
                    <div class="flex gap-lg">
                        <form th:action="@{/tvshow/follow}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="tvShowId" th:value="${show.id}" />
                            <button type="submit" th:class="${show.isFollowed} ? 'green' : ''" th:title="#{title.layout.follow}">
                                <i data-lucide="heart"></i>
                            </button>
                        </form>
                        <button type="button" data-open-modal="addToListModal" th:title="#{list.add.to}">
                            <i data-lucide="list-plus"></i>
                        </button>
                    </div>
                </div>

                <div th:replace="~{fragments/title-info :: titleInfo(${titleInfo})}"></div>
                <div th:replace="~{fragments/watch-status :: watchStatus('tvshow', ${show.id})}"></div>
                <div th:replace="~{fragments/tags :: titleTags('tvshow', ${show?.id}, ${show?.tmdbId})}"></div>

                <h2 class="title-section-heading" th:if="${show != null && !#lists.isEmpty(show.seasons)}" th:text="#{title.layout.seasons}">Seasons</h2>
        <div th:if="${show != null && !#lists.isEmpty(show.seasons)}">
            <div th:each="season : ${show.seasons}" class="card season-card"
                 th:classappend="${season.hasRating} ? 'clickable expandable' : ''">
                <div class="season-card-header flex separate">
                    <span class="text-soft" th:if="${season.seasonNumber != null}" th:text="#{tvshows.season.prefix} + ${season.seasonNumber}">Season 1</span>
                    <span th:if="${season.hasRating}" class="rating sm" th:text="${#strings.replace(#numbers.formatDecimal(season.score, 1, 2), ',', '.')}">5.73</span>
                    <button th:unless="${season.hasRating}" type="button" class="season-rate-btn" style="padding: 0;" data-open-modal="rateTvShowModal" data-modal-mode="create" th:data-season="${season.seasonNumber}">
                        <i data-lucide="star"></i>
                    </button>
                </div>
                <div th:if="${season.hasRating}" class="season-card-body">
                    <p th:replace="~{fragments/quick-rating :: quickRatingLabel(${season.quickRating})}"></p>
                    <div class="rating-breakdown" th:unless="${season.quickRating}"
                         th:data-categories="'directing:' + ${season.directing} + ',cinematography:' + ${season.cinematography} + ',acting:' + ${season.acting} + ',soundtrack:' + ${season.soundtrack} + ',screenplay:' + ${season.screenplay}"></div>
                    <span class="visually-hidden" data-i18n-key="directing" th:text="#{tvshows.rating.category.directing}">Directing</span>
                    <span class="visually-hidden" data-i18n-key="cinematography" th:text="#{tvshows.rating.category.cinematography}">Cinematography</span>
                    <span class="visually-hidden" data-i18n-key="acting" th:text="#{tvshows.rating.category.acting}">Acting</span>
                    <span class="visually-hidden" data-i18n-key="soundtrack" th:text="#{tvshows.rating.category.soundtrack}">Soundtrack</span>
                    <span class="visually-hidden" data-i18n-key="screenplay" th:text="#{tvshows.rating.category.screenplay}">Screenplay</span>
                    <div class="rating-detail-footer">
                        <div class="separator"></div>
                        <h4 th:if="${season.reviewTitle}" th:text="${season.reviewTitle}"></h4>
                        <p th:if="${season.reviewText}" class="t-long" th:text="${season.reviewText}"></p>
                    </div>
                    <div class="rating-actions">
                        <button type="button" class="edit-rating-btn"
                                data-open-modal="rateTvShowModal"
                                data-modal-mode="edit"
                                th:data-season="${season.seasonNumber}"
                                th:data-directing="${season.directing}"
                                th:data-cinematography="${season.cinematography}"
                                th:data-acting="${season.acting}"
                                th:data-soundtrack="${season.soundtrack}"
                                th:data-screenplay="${season.screenplay}"
                                th:data-score="${season.score}"
                                th:data-rating-mode="${season.quickRating} ? 'quick' : 'detailed'"
                                th:data-review-title="${season.reviewTitle}"
                                th:data-review-text="${season.reviewText}"
                                th:aria-label="#{tvshow.detail.edit.rating}">
                            <i data-lucide="pencil"></i>
                        </button>
                        <button type="button" class="delete-rating-btn" data-open-modal="deleteTvShowRatingModal" th:data-season="${season.seasonNumber}" th:aria-label="#{tvshow.detail.delete.rating}">
                            <i data-lucide="trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </div>

        <div th:replace="~{fragments/rate-tvshow-modal :: rateTvShowModal(${show})}"></div>
        <div th:replace="~{fragments/delete-tvshow-rating-modal :: deleteTvShowRatingModal(${show})}"></div>
        <div th:replace="~{fragments/add-to-list-modal :: addToListModal(${show.id}, 'tvshow')}"></div>
    </div>
    <script src="/confirm.js" defer></script>
</body>
<script>
    document.querySelectorAll('.season-card.expandable').forEach(card => {
        const header = card.querySelector('.season-card-header');
        if (!header) return;
        header.addEventListener('click', (e) => {
            if (e.target.closest('form, button')) return;
            card.classList.toggle('expanded');
        });
    });
</script>
</html>
