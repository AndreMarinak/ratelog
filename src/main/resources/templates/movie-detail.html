<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{movie.detail.title})}"></head>
<body>
    <div th:replace="~{fragments/loader}"></div>
    <div class="page">
        <header class="site-header" th:replace="~{fragments/nav :: nav(active='movies')}"></header>
        <link rel="stylesheet" href="/title-page.css">
        <link rel="stylesheet" href="/title-info.css">
        <link rel="stylesheet" href="/tile-actions.css">
        <link rel="stylesheet" href="/list-membership.css">

        <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
        <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

        <h1 th:if="${movie == null}" th:text="#{movie.detail.not.found}">Movie not found</h1>

        <nav th:replace="~{fragments/back-nav :: link(${backNav})}"></nav>
        <!--/* Fork layout (static/title-page.css): poster + where to watch | title, overview, scores, trailer, your rating | action panel. */-->
        <div th:if="${movie != null}" class="title-layout">
            <div class="title-col title-col-poster">
                <img class="detail title-poster" th:src="@{'https://image.tmdb.org/t/p/w500' + ${movie.posterPath}}" th:srcset="|https://image.tmdb.org/t/p/w500${movie.posterPath} 1x, https://image.tmdb.org/t/p/w780${movie.posterPath} 2x|" th:alt="'Poster of ' + ${movie.name}">
                <div th:replace="~{fragments/title-providers :: titleProviders(${watchProviders})}"></div>
            </div>

            <div class="title-col title-col-main">
                <header class="title-head">
                    <h1>
                        <span th:text="${movie.name}">Movie title</span>
                        <span th:if="${movie.firstAirYear != null}" class="year" th:text="${movie.firstAirYear}">Year</span>
                    </h1>
                    <span th:replace="~{fragments/title-actions :: upcoming(${titleActions})}"></span>
                    <div class="title-meta">
                        <th:block th:replace="~{fragments/title-info :: titleFacts(${titleInfo})}"></th:block>
                        <span class="tag" th:each="genreId : ${movie.genres}" th:text="#{${'genre.' + genreId}}">Genre</span>
                    </div>
                    <div th:replace="~{fragments/title-info :: titleScores(${titleInfo})}"></div>
                    <div th:replace="~{fragments/saved-lists :: titleLine(${officialTitleLists})}"></div>
                </header>

                <div class="title-body">
                    <p class="title-overview" id="title-overview" th:text="${movie.overview != null and movie.overview.trim().length() > 0} ? ${movie.overview} : #{movie.detail.no.synopsis}">Loading movie information.</p>
                    <button type="button" class="title-overview-toggle" aria-controls="title-overview" aria-expanded="false" hidden
                            th:data-more="#{title.overview.more}" th:data-less="#{title.overview.less}" th:text="#{title.overview.more}">More</button>
                </div>
                <div th:replace="~{fragments/title-info :: titleTrailer(${titleInfo})}"></div>

                <section th:if="${movie.hasRating}" class="card rating-detail-card title-rating">
                    <h2 class="rating-detail-title" th:text="#{movie.detail.your.rating}">Your rating</h2>
                    <p th:replace="~{fragments/quick-rating :: quickRatingLabel(${movie.quickRating})}"></p>
                    <p th:if="${movie.quickRating and movie.score != null}" class="rating quick-score"
                       th:text="${#strings.replace(#numbers.formatDecimal(movie.score, 1, 2), ',', '.')} + ' / 10'">8.50 / 10</p>
                    <div class="rating-breakdown" th:unless="${movie.quickRating}"
                         th:data-categories="'directing:' + ${movie.directing} + ',cinematography:' + ${movie.cinematography} + ',acting:' + ${movie.acting} + ',soundtrack:' + ${movie.soundtrack} + ',screenplay:' + ${movie.screenplay}"></div>
                    <span class="visually-hidden" data-i18n-key="directing" th:text="#{movies.rating.category.directing}">Directing</span>
                    <span class="visually-hidden" data-i18n-key="cinematography" th:text="#{movies.rating.category.cinematography}">Cinematography</span>
                    <span class="visually-hidden" data-i18n-key="acting" th:text="#{movies.rating.category.acting}">Acting</span>
                    <span class="visually-hidden" data-i18n-key="soundtrack" th:text="#{movies.rating.category.soundtrack}">Soundtrack</span>
                    <span class="visually-hidden" data-i18n-key="screenplay" th:text="#{movies.rating.category.screenplay}">Screenplay</span>
                    <div class="rating-detail-footer" th:if="${movie.reviewTitle != null or movie.reviewText != null}">
                        <div class="separator"></div>
                        <h4 th:if="${movie.reviewTitle}" th:text="${movie.reviewTitle}"></h4>
                        <p th:if="${movie.reviewText}" class="t-long" th:text="${movie.reviewText}"></p>
                    </div>
                    <div class="rating-actions">
                        <button type="button" class="edit-rating-btn"
                                data-open-modal="rateMovieModal"
                                data-modal-mode="edit"
                                th:data-directing="${movie.directing}"
                                th:data-cinematography="${movie.cinematography}"
                                th:data-acting="${movie.acting}"
                                th:data-soundtrack="${movie.soundtrack}"
                                th:data-screenplay="${movie.screenplay}"
                                th:data-score="${movie.score}"
                                th:data-rating-mode="${movie.quickRating} ? 'quick' : 'detailed'"
                                th:data-review-title="${movie.reviewTitle}"
                                th:data-review-text="${movie.reviewText}"
                                th:title="#{movie.detail.edit.rating}"
                                th:aria-label="#{movie.detail.edit.rating}">
                            <i data-lucide="pencil"></i>
                        </button>
                        <button type="button" class="delete-rating-btn" data-open-modal="deleteMovieRatingModal"
                                th:title="#{movie.detail.delete.rating}" th:aria-label="#{movie.detail.delete.rating}">
                            <i data-lucide="trash"></i>
                        </button>
                    </div>
                </section>
            </div>

            <div class="title-col title-col-side">
                <section class="title-panel" th:aria-label="#{title.panel.aria}">
                    <!--/* Fork: four equal toggles (Seen, Watchlist, Rate, Add to list), then the small extras (fragments/title-actions.html). */-->
                    <div class="title-actions">
                        <th:block th:replace="~{fragments/title-actions :: seen(${titleActions})}"></th:block>
                        <th:block th:replace="~{fragments/title-actions :: watchlist(${titleActions})}"></th:block>
                        <button th:if="${!movie.hasRating}" type="button" class="title-action"
                                data-open-modal="rateMovieModal" data-modal-mode="create">
                            <i data-lucide="star" aria-hidden="true"></i>
                            <span th:text="#{title.panel.rate}">Rate</span>
                        </button>
                        <!--/* Same data-* as the pencil in the "Your rating" card: the rate modal reads them to prefill. */-->
                        <button th:if="${movie.hasRating}" type="button" class="title-action is-rated"
                                data-open-modal="rateMovieModal"
                                data-modal-mode="edit"
                                th:data-directing="${movie.directing}"
                                th:data-cinematography="${movie.cinematography}"
                                th:data-acting="${movie.acting}"
                                th:data-soundtrack="${movie.soundtrack}"
                                th:data-screenplay="${movie.screenplay}"
                                th:data-score="${movie.score}"
                                th:data-rating-mode="${movie.quickRating} ? 'quick' : 'detailed'"
                                th:data-review-title="${movie.reviewTitle}"
                                th:data-review-text="${movie.reviewText}">
                            <i data-lucide="pencil" aria-hidden="true"></i>
                            <span th:text="#{movie.detail.edit.rating}">Edit rating</span>
                            <span th:if="${movie.score != null}" class="title-action-score" th:title="#{movie.detail.your.rating}"
                                  th:text="${#strings.replace(#numbers.formatDecimal(movie.score, 1, 2), ',', '.')}">8.50</span>
                        </button>
                        <button th:replace="~{fragments/add-to-list-modal :: addToListButton(${listMembership})}"></button>
                    </div>
                    <div th:replace="~{fragments/title-actions :: rateNudge(${titleActions})}"></div>
                    <div th:replace="~{fragments/title-actions :: extras(${titleActions})}"></div>

                    <div th:replace="~{fragments/tags :: titleTags('movie', ${movie.id}, ${movie.tmdbId})}"></div>
                </section>
            </div>
        </div>
        <section th:replace="~{fragments/title-related :: placeholder('movie', ${movie?.tmdbId})}"></section>

        <th:block th:if="${movie != null}">
            <div th:replace="~{fragments/rate-movie-modal :: rateMovieModal(${movie})}"></div>
            <div th:replace="~{fragments/delete-movie-rating-modal :: deleteMovieRatingModal(${movie})}"></div>
            <div th:replace="~{fragments/add-to-list-modal :: addToListModal(${movie.id}, 'movie')}"></div>
            <div th:replace="~{fragments/title-info :: trailerModal(${titleInfo})}"></div>
        </th:block>
    </div>
    <script src="/confirm.js" defer></script>
    <script src="/title-page.js" defer></script>
    <script src="/tile-actions.js" defer></script>
    <script src="/title-actions.js" defer></script>
    <script src="/list-membership.js" defer></script>
    <th:block th:replace="~{fragments/tile-rate :: assets}"></th:block>
</body>
</html>
