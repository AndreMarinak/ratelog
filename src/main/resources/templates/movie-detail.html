<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{movie.detail.title})}"></head>
<body>
    <div th:replace="~{fragments/loader}"></div>
    <div class="page">
        <header class="site-header" th:replace="~{fragments/nav :: nav(active='movies')}"></header>

        <h1>
            <span th:text="${movie != null} ? ${movie.name} : #{movie.detail.not.found}">Loading movie...</span>
            <span th:if="${movie != null && movie.firstAirYear != null}" class="year" th:text="${movie.firstAirYear}">Year</span>
        </h1>

        <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
        <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

        <!-- Fork layout: poster column on the left, everything about the title in the column beside it. -->
        <div class="title-layout">
            <aside class="title-aside">
                <img class="detail" th:src="@{'https://image.tmdb.org/t/p/w500' + ${movie.posterPath}}" th:srcset="|https://image.tmdb.org/t/p/w500${movie.posterPath} 1x, https://image.tmdb.org/t/p/w780${movie.posterPath} 2x|" th:alt="'Poster of ' + ${movie.name}">
                <div class="title-providers" th:if="${watchProviders != null and !#lists.isEmpty(watchProviders.flatrate)}">
                    <span class="title-section-label" th:text="#{title.layout.where.to.watch}">Where to watch</span>
                    <div class="flex wrap gap">
                        <a th:each="provider : ${watchProviders.flatrate}"
                           class="watch-provider"
                           th:href="${watchProviders.link != null} ? ${watchProviders.link.value} : null"
                           th:title="${provider.name.value}"
                           target="_blank" rel="noopener noreferrer">
                            <img th:src="@{'https://image.tmdb.org/t/p/w92' + ${provider.logoPath.value}}" th:alt="${provider.name.value}" loading="lazy" />
                        </a>
                    </div>
                </div>
            </aside>

            <div class="title-main">
                <div class="flex gap-lg separate">
                    <p class="title-overview" th:text="${movie.overview != null and movie.overview.trim().length() > 0} ? ${movie.overview} : #{movie.detail.no.synopsis}">Loading movie information.</p>
                    <span th:if="${movie.score != null}" class="rating" th:text="${#strings.replace(#numbers.formatDecimal(movie.score, 1, 2), ',', '.')}">0.00</span>
                </div>
                <div class="flex gap-lg separate centered wrap">
                    <div th:if="${!#lists.isEmpty(movie.genres)}" class="flex gap wrap">
                        <span class="tag" th:each="genreId : ${movie.genres}" th:text="#{${'genre.' + genreId}}">Genre</span>
                    </div>
                    <div class="flex gap-lg">
                        <button th:if="${!movie.hasRating}" type="button" data-open-modal="rateMovieModal" data-modal-mode="create" th:title="#{title.layout.rate}">
                            <i data-lucide="star"></i>
                        </button>
                        <form th:action="@{/movie/follow}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="movieId" th:value="${movie.id}" />
                            <button type="submit" th:class="${movie.isFollowed} ? 'green' : ''" th:title="#{title.layout.follow}">
                                <i data-lucide="heart"></i>
                            </button>
                        </form>
                        <button type="button" data-open-modal="addToListModal" th:title="#{list.add.to}">
                            <i data-lucide="list-plus"></i>
                        </button>
                    </div>
                </div>

                <div th:replace="~{fragments/title-info :: titleInfo(${titleInfo})}"></div>
                <div th:replace="~{fragments/watch-status :: watchStatus('movie', ${movie.id})}"></div>
                <div th:replace="~{fragments/tags :: titleTags('movie', ${movie?.id}, ${movie?.tmdbId})}"></div>

        <div th:if="${movie != null && movie.hasRating}" class="card rating-detail-card">
            <h2 class="rating-detail-title" th:text="#{movie.detail.your.rating}">Your rating</h2>
            <p th:replace="~{fragments/quick-rating :: quickRatingLabel(${movie.quickRating})}"></p>
            <p th:if="${movie.quickRating and movie.score != null}" class="rating quick-score"
               th:text="${#strings.replace(#numbers.formatDecimal(movie.score, 1, 2), ',', '.')} + ' / 10'">8.50 / 10</p>
            <div class="rating-breakdown" th:unless="${movie.quickRating}"
                 th:data-categories="'directing:' + ${movie.directing} + ',cinematography:' + ${movie.cinematography} + ',acting:' + ${movie.acting} + ',soundtrack:' + ${movie.soundtrack} + ',screenplay:' + ${movie.screenplay}"></div>
            <span class="visually-hidden" data-i18n-key="directing" th:text="#{movies.rating.category.directing}">Directing</span>
            <span class="visually-hidden" data-i18n-key="cinematography" th:text="#{movies.rating.category.cinematography}">Cinematography</span>
            <span class="visually-hidden" data-i18n-key="acting" th:text="#{movies.rating.category.acting}">Acting</span>
            <span class="visually-hidden" data-i18n-key="soundtrack" th:text="#{movies.rating.category.soundtrack}">Soundtrack</span>
            <span class="visually-hidden" data-i18n-key="screenplay" th:text="#{movies.rating.category.screenplay}">Screenplay</span>
            <div class="rating-detail-footer">
                <div class="separator"></div>
                <h4 th:if="${movie.reviewTitle}" th:text="${movie.reviewTitle}"></h4>
                <p th:if="${movie.reviewText}" class="t-long" th:text="${movie.reviewText}"></p>
            </div>
            <div class="rating-actions">
                <button type="button" class="edit-rating-btn"
                        data-open-modal="rateMovieModal"
                        data-modal-mode="edit"
                        th:data-directing="${movie.directing}"
                        th:data-cinematography="${movie.cinematography}"
                        th:data-acting="${movie.acting}"
                        th:data-soundtrack="${movie.soundtrack}"
                        th:data-screenplay="${movie.screenplay}"
                        th:data-score="${movie.score}"
                        th:data-rating-mode="${movie.quickRating} ? 'quick' : 'detailed'"
                        th:data-review-title="${movie.reviewTitle}"
                        th:data-review-text="${movie.reviewText}"
                        th:aria-label="#{movie.detail.edit.rating}">
                    <i data-lucide="pencil"></i>
                </button>
                <button type="button" class="delete-rating-btn" data-open-modal="deleteMovieRatingModal" th:aria-label="#{movie.detail.delete.rating}">
                    <i data-lucide="trash"></i>
                </button>
            </div>
        </div>
            </div>
        </div>

        <div th:replace="~{fragments/rate-movie-modal :: rateMovieModal(${movie})}"></div>
        <div th:replace="~{fragments/delete-movie-rating-modal :: deleteMovieRatingModal(${movie})}"></div>
        <div th:replace="~{fragments/add-to-list-modal :: addToListModal(${movie.id}, 'movie')}"></div>
    </div>
    <script src="/confirm.js" defer></script>
</body>
</html>
