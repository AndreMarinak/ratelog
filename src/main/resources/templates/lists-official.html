<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<!--/* Fork: /lists/official, every official list as a grid with the viewer's progress ("See all" from the rows). */-->
<head th:replace="~{fragments/head :: head(#{lists.official})}"></head>
<body>
<link rel="stylesheet" href="/home.css">
<link rel="stylesheet" href="/list-progress.css">
<link rel="stylesheet" href="/official-lists.css">
<link rel="stylesheet" href="/saved-lists.css">
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='lists')}"></header>

    <a class="list-back" href="/lists">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span th:text="#{list.back.lists}">Lists</span>
    </a>
    <div class="official-page-head">
        <h1 th:text="#{lists.official}">Official lists</h1>
        <p th:text="#{lists.official.subtitle}">Curated lists for everyone here. The progress is your own.</p>
    </div>

    <div th:if="${#lists.isEmpty(officialCards)}" class="empty-state" th:text="#{lists.official.empty}">No official lists yet.</div>
    <div th:unless="${#lists.isEmpty(officialCards)}" class="lists-grid official-grid" data-saved-first>
        <th:block th:each="card : ${officialCards}">
            <th:block th:replace="~{fragments/saved-lists :: card(${card})}"></th:block>
        </th:block>
    </div>
</div>
</body>
</html>
