<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{watchlist.title})}"></head>
<body>
<link rel="stylesheet" href="/watchlist.css">
<link rel="stylesheet" href="/tile-actions.css">
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='watchlist')}"></header>

    <h1 th:text="#{watchlist.title}">Watchlist</h1>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>
    <!--/* Fork: after a quick action, what happened and an Undo (so Remove needs no confirmation). */-->
    <div th:if="${watchlistNotice != null}" th:fragment="notice" class="feedback success watchlist-notice" role="status">
        <span th:text="#{${watchlistNotice.messageKey}(${watchlistNotice.title})}">Removed "Dune" from your watchlist.</span>
        <form th:if="${watchlistNotice.undoMove != null}" action="/watchlist/item" method="post" class="watchlist-undo">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="mediaType" th:value="${watchlistNotice.mediaType}" />
            <input type="hidden" name="mediaId" th:value="${watchlistNotice.mediaId}" />
            <input type="hidden" name="to" th:value="${watchlistNotice.undoMove}" />
            <input type="hidden" name="undo" value="1" />
            <input th:if="${watchlistNotice.rewatchId != null}" type="hidden" name="rewatchId" th:value="${watchlistNotice.rewatchId}" />
            <input type="hidden" name="back" th:value="${watchlistSelf}" />
            <button type="submit">
                <i data-lucide="undo-2" aria-hidden="true"></i>
                <span th:text="#{watchlist.notice.undo}">Undo</span>
            </button>
        </form>
    </div>

    <!--/* Fork: the tabs and the Movies / TV filter switch in place (view-swap.js): the toolbar, hint and grid below are
           swapped from the new URL, which replaces this entry's URL (one Back leaves the watchlist). */-->
    <div id="watchlistView" data-view data-view-fallback="status">
    <div class="watchlist-toolbar" th:fragment="toolbar">
        <nav class="status-segmented watchlist-tabs" th:aria-label="#{watchlist.filter.status}" data-view-links="status">
            <a th:each="tab : ${tabs}" th:href="${tab.href}" class="status-segment" th:data-status="${tab.status}"
               th:classappend="${tab.active} ? 'active' : ''"
               th:aria-current="${tab.active} ? 'page' : null">
                <i th:data-lucide="${tab.icon}" aria-hidden="true"></i>
                <span th:text="#{${tab.labelKey}}">To watch</span>
                <span class="status-count" th:text="${tab.count}">0</span>
            </a>
        </nav>
        <nav class="status-segmented" th:aria-label="#{watchlist.filter.type}" data-view-links="type">
            <a th:each="filter : ${typeFilters}" th:href="${filter.href}" class="status-segment"
               th:classappend="${filter.active} ? 'active' : ''"
               th:aria-current="${filter.active} ? 'page' : null"
               th:text="#{${filter.labelKey}}">All</a>
        </nav>
    </div>
    <p th:if="${tabHintKey != null and !#lists.isEmpty(items)}" class="watchlist-hint" th:text="#{${tabHintKey}}">What you want to see next.</p>

    <!--/* Always rendered (hidden while there are tiles) so watchlist.js can show it when the last tile moves away. */-->
    <div class="empty-state watchlist-empty" th:fragment="empty" th:hidden="${!#lists.isEmpty(items)}" th:text="#{${emptyKey}}">Nothing here yet.</div>

    <!--/* Each tile: the poster link, then its quick actions as plain POST forms (POST /watchlist/item) that come back to this tab. */-->
    <div class="list-grid watchlist-grid" th:fragment="grid">
        <div th:each="item : ${items}" class="watchlist-item">
            <a th:href="${item.href}" class="list-card">
                <div class="poster-frame">
                    <span class="type-tag" th:if="${item.isMovie}" th:title="#{search.type.movie}"><i data-lucide="film" aria-hidden="true"></i></span>
                    <span class="type-tag" th:unless="${item.isMovie}" th:title="#{search.type.tv}"><i data-lucide="tv" aria-hidden="true"></i></span>
                    <img th:if="${item.posterPath != null}" th:src="@{'https://image.tmdb.org/t/p/w342' + ${item.posterPath}}" th:srcset="|https://image.tmdb.org/t/p/w342${item.posterPath} 1x, https://image.tmdb.org/t/p/w500${item.posterPath} 2x|" th:alt="'Poster of ' + ${item.title}" loading="lazy">
                    <div th:unless="${item.posterPath != null}" class="poster-fallback" th:text="${#strings.toUpperCase(#strings.substring(item.title, 0, 1))}">?</div>
                    <span th:if="${item.upcoming}" class="tile-upcoming">
                        <span class="tile-upcoming-word" th:text="#{tile.upcoming}">Upcoming</span>
                        <span class="tile-upcoming-date" th:text="${item.upcomingDate}">Dec 18</span>
                    </span>
                </div>
                <div class="list-content">
                    <h3>
                        <span th:text="${item.title}">Title</span>
                        <span class="year" th:text="${item.year != null} ? ${item.year} : #{movies.year.unknown}">Year</span>
                    </h3>
                    <span th:if="${item.score != null}" class="rating sm" th:title="#{watchlist.your.score}"
                          th:text="${#strings.replace(#numbers.formatDecimal(item.score, 1, 2), ',', '.')}">0.00</span>
                </div>
            </a>
            <!--/* Fork (tile rating): Add to list and ★ on the poster (the bookmark and eye are the buttons below here). */-->
            <div th:replace="~{fragments/tile-actions :: actions(${item.tileActions}, ${item.title})}"></div>
            <!--/* Fork: the same slots on every tile of a tab, movies and shows alike; a note fills any slot no button can. */-->
            <div th:unless="${#lists.isEmpty(item.actions) and item.noteKey == null}" class="watchlist-actions" role="group"
                 th:classappend="'slots-' + ${item.slots}" th:style="'--slots: ' + ${item.slots}"
                 th:aria-label="#{watchlist.actions.aria(${item.title})}">
                <span th:if="${item.noteKey != null}" class="watchlist-note" th:style="'grid-column: span ' + ${item.noteSpan}"
                      th:title="#{${item.noteTitleKey}}">
                    <i th:data-lucide="${item.noteIcon}" aria-hidden="true"></i>
                    <span th:text="#{${item.noteKey}(${item.upcomingDate})}">Out Dec 18</span>
                </span>
                <form th:each="act, st : ${item.actions}" action="/watchlist/item" method="post"
                      th:style="${st.first and item.firstSpan > 1} ? ('grid-column: span ' + ${item.firstSpan}) : null">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="mediaType" th:value="${item.mediaType}" />
                    <input type="hidden" name="mediaId" th:value="${item.mediaId}" />
                    <input type="hidden" name="to" th:value="${act.to}" />
                    <input type="hidden" name="back" th:value="${watchlistSelf}" />
                    <button type="submit" class="watchlist-act" th:classappend="${act.kind}"
                            th:aria-label="#{${act.ariaKey}(${item.title})}" th:title="#{${act.ariaKey}(${item.title})}">
                        <i th:data-lucide="${act.icon}" aria-hidden="true"></i>
                        <span class="watchlist-act-label" th:text="#{${act.labelKey}}">Seen</span>
                        <span th:if="${act.shortLabelKey != null}" class="watchlist-act-short" aria-hidden="true" th:text="#{${act.shortLabelKey}}">Again</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    </div>
</div>
<script src="/watchlist.js" defer></script>
<script src="/view-swap.js" defer></script>
<script src="/tile-actions.js" defer></script>
<th:block th:replace="~{fragments/tile-rate :: assets}"></th:block>
</body>
</html>
