<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{search.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='search')}"></header>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

    <!--/* Fork: the header search covers the home page; this form stays on results pages as the type filter. */-->
    <h1 th:if="${results != null or param.q != null}" th:text="#{search.hero}">Find movies and TV shows.</h1>

    <section class="panel">
        <form th:if="${results != null or param.q != null}" th:action="@{/}" class="filter" method="get">
            <input class="w-75" id="q" name="q" type="text" th:value="${query}" th:placeholder="#{search.placeholder}" autocomplete="off" th:aria-label="#{search.btn}">
            <select id="mediaType" name="mediaType" class="type-filter" th:aria-label="#{search.filter.type}">
                <option value="" th:selected="${mediaType == null}" th:text="#{search.filter.any}">Any</option>
                <option value="movie" th:selected="${mediaType == 'movie'}" th:text="#{search.type.movie}">Movies</option>
                <option value="tvshow" th:selected="${mediaType == 'tvshow'}" th:text="#{search.type.tv}">TV Shows</option>
            </select>
            <button class="primary" type="submit" th:aria-label="#{search.btn}" th:title="#{search.btn}">
                <i data-lucide="search" aria-hidden="true"></i>
            </button>
        </form>

        <p th:if="${!tmdbConfigured}" class="warning-text">
            <i data-lucide="alert-triangle" aria-hidden="true"></i>
            <span th:text="#{search.tmdb.not.configured}">A TMDB API key must be configured for Ratelog to work.</span>
        </p>

        <!--/* Fork: results are the home rows' poster tiles (home.css) in a grid (search-results.css). search.js builds the same markup for later pages. */-->
        <th:block th:if="${results != null}"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/search-results.css"><link rel="stylesheet" href="/tile-actions.css"></th:block>
        <div th:if="${results != null}" id="results" class="search-grid">
            <div th:text="#{search.empty}" th:if="${#lists.isEmpty(results)}" class="empty-state"></div>

            <!--/* Fork: each tile is wrapped so the Seen / Watchlist quick actions (resultActions, SearchTileActionsInterceptor) sit beside the link. */-->
            <div th:each="item : ${results}" class="home-tile-wrap search-tile-wrap"
                 th:with="actions=${resultActions != null} ? ${resultActions[item.type + '-' + item.tmdbId]} : null"
                 th:attr="data-key=${item.type + '-' + item.tmdbId}">
            <a th:href="${item.type == 'movie'} ? @{/movie/{id}(id=${item.tmdbId})} : @{/tv/{id}(id=${item.tmdbId})}"
               class="home-tile search-tile">
                <div class="home-poster">
                    <img th:if="${item.posterPath != null}" th:src="@{'https://image.tmdb.org/t/p/w342' + ${item.posterPath}}"
                         th:srcset="|https://image.tmdb.org/t/p/w342${item.posterPath} 342w, https://image.tmdb.org/t/p/w500${item.posterPath} 500w|"
                         sizes="(max-width: 600px) 31vw, 170px" th:alt="'Poster of ' + ${item.title}" loading="lazy" decoding="async">
                    <div th:unless="${item.posterPath != null}" class="poster-fallback" th:text="${#strings.toUpperCase(#strings.substring(item.title, 0, 1))}">?</div>
                    <span class="home-type" th:if="${item.type == 'movie'}" th:title="#{search.type.movie}"><i data-lucide="film" aria-hidden="true"></i></span>
                    <span class="home-type" th:unless="${item.type == 'movie'}" th:title="#{search.type.tv}"><i data-lucide="tv" aria-hidden="true"></i></span>
                    <span th:replace="~{fragments/tile-actions :: upcoming(${actions})}"></span>
                </div>
                <span class="home-tile-title" th:text="${item.title}" th:title="${item.title}">Title</span>
                <span class="home-tile-meta" th:text="${item.year != null} ? ${item.year} : #{movies.year.unknown}">Year</span>
            </a>
            <div th:replace="~{fragments/tile-actions :: actions(${actions}, ${item.title})}"></div>
            </div>
        </div>

        <div th:if="${hasMore}" id="scroll-sentinel" class="scroll-sentinel"
             th:data-query="${query}"
             th:data-media-type="${mediaType}"
             th:data-page="${currentPage}">
        </div>

        <div th:if="${results != null}" class="separator"></div>

        <!--/* Fork: home dashboard rows instead of the trending grid. */-->
        <th:block th:if="${results == null and home != null}">
            <div th:replace="~{fragments/home-dashboard :: dashboard(${home})}"></div>
        </th:block>
    </section>
</div>
<script th:if="${hasMore}" th:src="@{/search.js}"></script>
<script th:if="${results != null}" src="/tile-actions.js" defer></script>
</body>
</html>
