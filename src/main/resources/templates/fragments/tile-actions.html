<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Fork: quick actions on poster tiles (home rows, Discover rows and grid, search results, list pages).
  `a` is an org.ratelog.watchlist.seen.TileActionsView. Styles in static/tile-actions.css; static/tile-actions.js posts
  both forms in place (JSON) and keeps the stack in sync. Without JS they are plain POST forms that redirect back.

  Quick actions (a sibling of the tile link, inside a position: relative wrapper):
    <div th:replace="~{fragments/tile-actions :: actions(${tile.actions}, ${tile.title})}"></div>
  Upcoming badge (inside the poster):
    <span th:replace="~{fragments/tile-actions :: upcoming(${tile.actions})}"></span>

  Fork (tile rating): the stack is an overlay the size of the poster. Top right: bookmark (or badge).
  Bottom right, where your score badge always sat: Add to list, the Seen eye, then ★ ("★ 8.5" once rated). Upcoming
  titles get no eye and no ★, and their list button sits under the bookmark, clear of the Upcoming badge. ★ and the
  list button are links to the title page without JS; static/tile-rate.js opens the rating picker / the add-to-list
  sheet in place. `tileMarks` (org.ratelog.tile.TileMarks, on every page) says which titles are in your lists and
  which ratings are detailed.
  Fork (tile menu, 2026-11-23): at rest a poster only shows quiet marks: the eye when seen, "★ 8.5" when rated. With a
  mouse the four buttons appear on hover / keyboard focus; on touch screens they stay hidden and one "⋯" button (top
  right) opens a chooser with the same four actions (tile-actions.js, template in fragments/tile-rate.html).
*/-->
<div th:fragment="actions(a, title)" th:if="${a != null}" class="tile-actions" data-tile-actions
     th:classappend="${a.upcoming} ? 'is-upcoming' : ''"
     th:with="inList=${tileMarks != null and tileMarks.inList(a)}, detailed=${a.ratingDetailed or (tileMarks != null and tileMarks.detailed(a))}"
     th:attr="data-label-seen-off=#{tile.seen.mark},data-label-seen-on=#{tile.seen.on},data-label-seen-locked=#{tile.seen.locked},data-label-add=#{watchlist.quick.add},data-label-remove=#{watchlist.quick.remove},data-title=${title},data-key=${a.type + ':' + a.tmdbId}">
    <!--/* Fork (tile menu): touch screens get this one button instead of the four (tile-actions.css hides it with a
           mouse). It opens the chooser (Watchlist / Seen / Rate / Add to list, tile-actions.js), whose rows use the
           controls below, so every action saves exactly as it does from them. */-->
    <button type="button" class="tile-menu-btn" data-tile-menu aria-haspopup="dialog" aria-expanded="false"
            th:title="#{tile.menu.open}" th:aria-label="#{tile.menu.open.aria(${title})}">
        <i data-lucide="ellipsis" aria-hidden="true"></i>
    </button>
    <!--/* Watchlist: rendered even when it can't toggle (Watching / Watched / Dropped), hidden, so un-seeing can bring it back. */-->
    <form class="tile-act tile-watchlist" th:classappend="${a.onWatchlist} ? 'is-on' : ''" th:hidden="${!a.canToggleWatchlist}"
          action="/watchlist/toggle" method="post" data-tile-act="watchlist">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="tmdbId" th:value="${a.tmdbId}" />
        <input type="hidden" name="type" th:value="${a.type}" />
        <button type="submit"
                th:with="label=${a.onWatchlist} ? #{watchlist.quick.remove} : #{watchlist.quick.add}"
                th:title="${label}" th:aria-label="${label} + ': ' + ${title}" th:aria-pressed="${a.onWatchlist}">
            <i th:data-lucide="${a.onWatchlist} ? 'bookmark-check' : 'bookmark'" aria-hidden="true"></i>
        </button>
    </form>
    <span th:if="${a.badgeIcon != null}" class="tile-act tile-badge" th:classappend="${'is-' + a.status}" role="img"
          th:title="#{${a.badgeKey}}" th:aria-label="#{${a.badgeKey}}">
        <i th:data-lucide="${a.badgeIcon}" aria-hidden="true"></i>
    </span>
    <!--/* Upcoming: no eye and no ★, so the list button sits under the bookmark (the Upcoming badge is bottom left). */-->
    <th:block th:if="${a.upcoming}"><a th:replace="~{fragments/tile-actions :: listButton(${a}, ${title}, ${inList})}"></a></th:block>

    <!--/* Bottom right, where your score badge always sat: Add to list, the Seen eye, then ★ ("★ 8.5" once rated).
           Seen and your score stay on the poster as quiet marks; everything else waits for hover (mouse) or the
           chooser (touch). */-->
    <div th:unless="${a.upcoming}" class="tile-acts-bottom">
        <a th:replace="~{fragments/tile-actions :: listButton(${a}, ${title}, ${inList})}"></a>
        <!--/* Seen: not offered on upcoming titles. A rated title is locked on: tapping it only explains why. */-->
        <form th:if="${a.canToggleSeen}" class="tile-act tile-seen"
              th:classappend="(${a.seen} ? 'is-on' : '') + (${a.seenLocked} ? ' is-locked' : '')"
              action="/seen/toggle" method="post" data-tile-act="seen">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="tmdbId" th:value="${a.tmdbId}" />
            <input type="hidden" name="type" th:value="${a.type}" />
            <button type="submit"
                    th:with="label=${a.seenLocked} ? #{tile.seen.locked} : (${a.seen} ? #{tile.seen.on} : #{tile.seen.mark})"
                    th:title="${label}" th:aria-label="${label} + ': ' + ${title}" th:aria-pressed="${a.seen}">
                <i data-lucide="eye" aria-hidden="true"></i>
                <!--/* Shown instead of the eye in list tick-off mode (tile-actions.css). */-->
                <i data-lucide="check" aria-hidden="true"></i>
            </button>
        </form>
        <!--/* Rate: a movie opens the quick-rating picker (tile-rate.js; data-tile-rate), a show its seasons (rated per
               season). Rated: "★ 8.5", always visible; a detailed rating is marked so the picker won't flatten it. */-->
        <a class="tile-act tile-rate" th:classappend="(${a.score != null} ? 'is-on' : '') + (${detailed} ? ' is-detailed' : '')"
           th:href="${a.rateHref}"
           th:with="label=#{${a.rateLabelKey}(${a.scoreLabel})}, labelDetailed=#{tile.rate.on.detailed(${a.scoreLabel})}"
           th:title="${detailed} ? ${labelDetailed} : ${label}"
           th:aria-label="(${detailed} ? ${labelDetailed} : ${label}) + ': ' + ${title}"
           th:attr="data-tile-rate=${a.isMovie} ? 'movie' : null,aria-haspopup=${a.isMovie} ? 'dialog' : null,data-score=${a.score},data-detailed=${detailed} ? 'true' : null,data-title-href=${a.titleHref}">
            <i data-lucide="star" aria-hidden="true"></i>
            <span th:if="${a.scoreLabel != null}" class="tile-rate-score" th:text="${a.scoreLabel}">8.5</span>
        </a>
    </div>
</div>

<!--/* Add to list: the title page's add-to-list sheet, loaded in place by tile-rate.js (GET /tile/lists). Ticked
       (list-checks) once the title is in any of your lists. Without JS: the title page, which opens its sheet. */-->
<a th:fragment="listButton(a, title, inList)" class="tile-act tile-list" th:classappend="${inList} ? 'is-on' : ''"
   th:href="${a.listsHref}" data-tile-lists aria-haspopup="dialog"
   th:with="label=${inList} ? #{tile.lists.in} : #{tile.lists.add}"
   th:title="${label}" th:aria-label="${label} + ': ' + ${title}"
   th:attr="data-tmdb-id=${a.tmdbId},data-type=${a.type}">
    <i th:data-lucide="${inList} ? 'list-checks' : 'list-plus'" aria-hidden="true"></i>
</a>

<!--/* "Upcoming · Dec 18" on the poster (bottom left). The word and the date wrap onto two lines on narrow tiles. */-->
<span th:fragment="upcoming(a)" th:if="${a != null and a.upcoming}" class="tile-upcoming">
    <span class="tile-upcoming-word" th:text="#{tile.upcoming}">Upcoming</span>
    <span th:if="${a.upcomingDate != null}" class="tile-upcoming-date" th:text="${a.upcomingDate}">Dec 18</span>
</span>
</body>
</html>
