<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Status control for detail pages. Model: watchStatus (current, may be null) and watchStatusOptions,
       both added by WatchStatusModelAdvice. Clicking the active status clears it. */-->
<div th:fragment="watchStatus(mediaType, mediaId)" class="watch-status">
    <link rel="stylesheet" href="/watchlist.css">
    <span class="title-section-label" th:text="#{status.control.heading}">Your watchlist</span>
    <form th:action="@{/status}" method="post" class="status-segmented" role="group" th:aria-label="#{status.control.label}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="mediaType" th:value="${mediaType}" />
        <input type="hidden" name="mediaId" th:value="${mediaId}" />
        <button th:each="option : ${watchStatusOptions}"
                th:with="active=${watchStatus == option}"
                type="submit" name="status" class="status-segment"
                th:value="${active} ? '' : ${option.apiName}"
                th:classappend="${active} ? 'active' : ''"
                th:aria-pressed="${active}"
                th:title="${active} ? #{status.clear} : #{${option.messageKey}}">
            <i th:data-lucide="${option.icon}" aria-hidden="true"></i>
            <span th:text="#{${option.messageKey}}">Want to watch</span>
        </button>
    </form>
</div>
</body>
</html>
