<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<!--/* Fork: a list as a card with a cover of its first posters. `card` is a ListCardView. Styles in home.css.
       Official lists show the "Official" badge in place of the owner / visibility (official lists are always public). */-->
<a th:fragment="listCard(card)" class="list-tile" th:href="${card.href}">
    <div class="list-cover" aria-hidden="true">
        <th:block th:each="url : ${card.coverPosterUrls}">
            <img th:if="${url != null}" th:src="${url}" alt="" loading="lazy" decoding="async">
            <span th:unless="${url != null}" class="list-cover-empty"></span>
        </th:block>
    </div>
    <span class="list-tile-name" th:text="${card.name}">List name</span>
    <span class="list-tile-meta">
        <span th:if="${card.seenCount == null or card.itemCount == 0}" th:text="#{lists.count(${card.itemCount})}">12 titles</span>
        <span th:unless="${card.seenCount == null or card.itemCount == 0}" class="list-tile-seen"
              th:classappend="${card.seenCount > 0} ? 'has-seen' : ''"
              th:text="#{lists.seen(${card.seenCount}, ${card.itemCount})}">9/25 seen</span>
        <span th:if="${card.isOfficial}" class="list-tile-visibility list-tile-official" th:title="#{lists.official.badge.title}">
            <i data-lucide="badge-check" aria-hidden="true"></i>
            <span th:text="#{lists.official.badge}">Official</span>
        </span>
        <span th:if="${card.ownerUsername != null and !card.isOfficial}" class="list-tile-owner" th:text="#{lists.by(${card.ownerUsername})}">by someone</span>
        <span th:if="${card.ownerUsername == null and !card.isOfficial}" class="list-tile-visibility" th:classappend="${card.isPublic} ? 'public' : ''">
            <i th:data-lucide="${card.isPublic} ? 'globe' : 'lock'" aria-hidden="true"></i>
            <span th:text="${card.isPublic} ? #{list.public} : #{lists.private}">Public</span>
        </span>
    </span>
</a>
</body>
</html>
