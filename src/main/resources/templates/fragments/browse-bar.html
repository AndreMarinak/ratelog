<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Fork: the "Browse by" bar (Movies / TV, Year, Rating, Popular, Genre, Service, More, Sort) plus "Find a title".
  Self-contained: brings its own /browse-bar.css and /browse-bar.js, and every option is a plain link to /discover.
  Fork: the data-view-links groups only matter on /discover, where view-swap.js applies the links in place.

  Include anywhere:      <div th:replace="~{fragments/browse-bar :: browseBar}"></div>
  Start on TV:           <div th:replace="~{fragments/browse-bar :: browseBar(browseType='tv')}"></div>
  With a filter state:   <div th:replace="~{fragments/browse-bar :: browseBar(browseBar=${view})}"></div>

  `browseBar` is an org.ratelog.browse.web.BrowseBarView (the /discover page puts one in the model). Without it the
  bar is built by @browseBarViews.defaults(browseType): no filters, the user's streaming region, no Sort menu.
-->
<body>
<section th:fragment="browseBar" class="browse-bar"
         th:with="bar=${browseBar ?: @browseBarViews.defaults(browseType)}"
         th:attr="data-type=${bar.type}" data-view-links="bar"
         th:aria-label="#{browse.by}">
    <link rel="stylesheet" href="/browse-bar.css">
    <script src="/browse-bar.js" defer></script>

    <div class="bb-main">
        <nav class="bb-type" th:aria-label="#{browse.type.aria}" data-view-links="type">
            <a th:each="link : ${bar.typeLinks}" th:href="${link.href}" class="bb-type-link"
               th:classappend="${link.active} ? 'active' : ''"
               th:aria-current="${link.active} ? 'page' : null"
               th:text="${link.label}">Movies</a>
        </nav>

        <span class="bb-label" aria-hidden="true" th:text="#{browse.by}">Browse by</span>

        <div class="bb-menus" role="group" th:aria-label="#{browse.menus.aria}">
            <th:block th:each="menu : ${bar.menus}"><details th:replace="~{fragments/browse-bar :: browseMenu(${menu})}"></details></th:block>
        </div>

        <!--/* No "Find a title" field here: the header's search is on every page (two search boxes on Home, user 2026-11-23). */-->
    </div>

    <div class="bb-sub" th:if="${!#lists.isEmpty(bar.chips) or bar.sortMenu != null}">
        <ul class="bb-chips" th:aria-label="#{browse.chips.aria}" data-view-links="chips">
            <li th:each="chip : ${bar.chips}">
                <a class="bb-chip" th:href="${chip.removeHref}" th:aria-label="${chip.removeLabel}" th:title="${chip.removeLabel}">
                    <span th:text="${chip.label}">Horror</span>
                    <i data-lucide="x" aria-hidden="true"></i>
                </a>
            </li>
            <li th:if="${#lists.size(bar.chips) > 1}">
                <a class="bb-clear" th:href="${bar.clearHref}" th:text="#{browse.clear}">Clear all</a>
            </li>
        </ul>

        <details th:if="${bar.sortMenu != null}" th:with="menu=${bar.sortMenu}" class="bb-menu bb-sort" th:attr="data-menu=${menu.id}">
            <summary class="bb-trigger">
                <i th:data-lucide="${menu.icon}" aria-hidden="true"></i>
                <span class="bb-trigger-label" th:text="${menu.label}">Sort</span>
                <span class="bb-trigger-value" th:text="${menu.value}">Popularity</span>
                <i data-lucide="chevron-down" class="bb-chevron" aria-hidden="true"></i>
            </summary>
            <div class="bb-panel" th:insert="~{fragments/browse-bar :: browsePanel(${menu})}"></div>
        </details>
    </div>
</section>

<!--/* One menu: its trigger and panel. Fork (2026-11-24): also the search page's Year menu (needs /browse-bar.css + .js). */-->
<details th:fragment="browseMenu(menu)" class="bb-menu"
         th:classappend="${menu.active} ? 'is-set' : ''"
         th:attr="data-menu=${menu.id}"
         th:open="${menu.yearBox != null and menu.yearBox.invalid}">
    <summary class="bb-trigger">
        <i th:data-lucide="${menu.icon}" aria-hidden="true"></i>
        <span class="bb-trigger-label" th:text="${menu.label}">Year</span>
        <span class="bb-trigger-value" th:if="${menu.value != null}" th:text="${menu.value}">2010s</span>
        <i data-lucide="chevron-down" class="bb-chevron" aria-hidden="true"></i>
    </summary>
    <div class="bb-panel" th:insert="~{fragments/browse-bar :: browsePanel(${menu})}"></div>
</details>

<th:block th:fragment="browsePanel(menu)">
    <p class="bb-note" th:if="${menu.note != null}" th:text="${menu.note}">Couldn't load streaming services.</p>
    <!--/* Fork (2026-11-24): "Type a year" (search's Year menu). A GET form, so it works without JS; search-type.js
           checks the year before view-swap.js applies it in place. */-->
    <form th:if="${menu.yearBox != null}" th:with="box=${menu.yearBox}" class="bb-year-box" th:action="${box.action}"
          method="get" data-year-box novalidate>
        <input th:each="field : ${box.hidden}" type="hidden" th:name="${field.name}" th:value="${field.value}">
        <label class="bb-section-heading" th:for="|bbYear-${menu.id}|" th:text="${box.label}">Type a year</label>
        <div class="bb-year-row">
            <input th:id="|bbYear-${menu.id}|" class="bb-year-input" type="text" name="year" inputmode="numeric"
                   maxlength="4" autocomplete="off" enterkeyhint="go" th:value="${box.value}"
                   th:placeholder="${box.placeholder}"
                   th:attr="data-min=${box.min}, data-max=${box.max}, aria-describedby=|bbYearError-${menu.id}|, aria-invalid=${box.invalid} ? 'true' : null">
            <button class="bb-year-go" type="submit" th:text="${box.submitLabel}">Go</button>
        </div>
        <p class="bb-year-error" th:id="|bbYearError-${menu.id}|" role="alert" th:hidden="${!box.invalid}" th:text="${box.error}">
            Type a year from 1874 to 2036.</p>
    </form>
    <div th:each="section : ${menu.sections}" class="bb-section" th:classappend="'bb-' + ${section.layout}"
         th:attr="data-reveal=${section.reveal} ? 'true' : null">
        <h3 class="bb-section-heading" th:if="${section.heading != null}" th:text="${section.heading}">Heading</h3>
        <ul class="bb-options" th:if="${section.more == null}">
            <li th:each="link : ${section.links}" th:insert="~{fragments/browse-bar :: browseOption(${link}, ${section})}"></li>
        </ul>
        <!--/* Fork: "Show all services" — a plain <details> without JS; browse-bar.js turns on the search box. */-->
        <details th:if="${section.more != null}" class="bb-more" data-inner="more" th:open="${section.more.open}">
            <summary class="bb-more-toggle">
                <span th:text="${section.more.label}">Show all services (280)</span>
                <i data-lucide="chevron-down" class="bb-chevron" aria-hidden="true"></i>
            </summary>
            <div class="bb-more-search" data-bb-search hidden>
                <i data-lucide="search" aria-hidden="true"></i>
                <input type="search" class="bb-search-input" autocomplete="off" spellcheck="false"
                       th:placeholder="${section.more.searchLabel}" th:aria-label="${section.more.searchLabel}">
            </div>
            <ul class="bb-options">
                <li th:each="link : ${section.links}" th:insert="~{fragments/browse-bar :: browseOption(${link}, ${section})}"></li>
            </ul>
            <p class="bb-no-match" data-bb-no-match hidden th:text="${section.more.noMatches}">No service matches.</p>
        </details>
    </div>
</th:block>

<!--/* One option: a plain link. Fork: data-keep-open / data-option let view-swap.js re-open the menu on it. */-->
<th:block th:fragment="browseOption(link, section)">
    <a class="bb-option" th:href="${link.href}"
       th:classappend="${link.active} ? 'active' : ''"
       th:aria-current="${link.active} ? 'true' : null"
       th:attr="data-keep-open=${link.keepOpen} ? 'true' : null, data-option=${link.option}">
        <span class="bb-check" th:if="${section.layout == 'toggles'}" aria-hidden="true"><i data-lucide="check"></i></span>
        <span class="bb-check bb-tick" th:if="${link.checkbox}" aria-hidden="true"></span>
        <img th:if="${link.logoUrl != null}" class="bb-logo" th:src="${link.logoUrl}" alt="" loading="lazy" width="28" height="28">
        <span class="bb-option-text">
            <span class="bb-option-label" th:text="${link.label}">2010s</span>
            <span class="bb-option-hint" th:if="${link.hint != null}" th:text="${link.hint}">Hint</span>
        </span>
    </a>
</th:block>
</body>
</html>
