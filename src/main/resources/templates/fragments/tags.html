<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>

<!-- Chip styles, shared by the tag pages and the strip on title pages. -->
<style th:fragment="tagStyles">
    .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--tag-bg);
        color: var(--text);
        letter-spacing: 0.02em;
        line-height: 1.3;
        text-decoration: none;
    }
    .tag-chip.colored {
        background: color-mix(in srgb, var(--tag-color) 18%, transparent);
        border-color: color-mix(in srgb, var(--tag-color) 55%, transparent);
    }
    .tag-chip a { color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .tag-chip a:hover, a.tag-chip:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .tag-chip form { display: inline-flex; }
    .tag-chip button { padding: 0; margin-right: -4px; color: var(--text-soft); }
    .tag-chip button:hover { color: var(--text); }
    .tag-chip button svg { width: 14px; height: 14px; }
    .tag-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--tag-color, var(--text-soft));
    }

    .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .swatch { position: relative; display: inline-flex; cursor: pointer; }
    .swatch input[type="radio"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        opacity: 0;
        cursor: pointer;
    }
    .swatch span {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--tag-color);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }
    .swatch.none span { background: var(--tag-bg); box-shadow: inset 0 0 0 1px var(--border-strong); }
    .swatch input:checked + span { outline: 2px solid var(--text); outline-offset: 2px; }
    .swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<!-- Radio swatches for the palette. `colors` comes from the page model. -->
<div th:fragment="colorPicker(selected)" class="swatches" role="radiogroup" th:aria-label="#{tags.color}">
    <label class="swatch none" th:title="#{tags.color.none}">
        <input type="radio" name="color" value="none" th:checked="${selected == null}" th:aria-label="#{tags.color.none}">
        <span></span>
    </label>
    <label th:each="c : ${colors}" class="swatch" th:style="${c.style}" th:title="#{${'tags.color.' + c.name}}">
        <input type="radio" name="color" th:value="${c.name}" th:checked="${selected == c.name}" th:aria-label="#{${'tags.color.' + c.name}}">
        <span></span>
    </label>
</div>

<!--
    The user's tags on one title, with an inline add form and an x per chip.
    Included once from movie-detail.html and tvshow-detail.html; data comes from the titleTagsView bean.
-->
<section th:fragment="titleTags(mediaType, mediaId, tmdbId)" th:if="${mediaId != null}"
         th:with="tt=${@titleTagsView.forTitle(mediaType, mediaId)}"
         class="title-tags" th:aria-label="#{tags.title}">
    <style th:replace="~{fragments/tags :: tagStyles}"></style>
    <style>
        .title-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
        .title-tags .title-tags-icon { width: 18px; height: 18px; color: var(--text-soft); flex-shrink: 0; }
        .title-tags-add { display: inline-flex; align-items: center; gap: 4px; }
        .title-tags-add input { height: 32px; width: 190px; max-width: 60vw; padding: 0 12px; font-size: 0.95rem; }
        .title-tags-add button { padding: 4px; }
    </style>

    <a th:href="@{/tags}" class="link secondary" th:title="#{tags.manage}" th:aria-label="#{tags.manage}">
        <i data-lucide="tags" class="title-tags-icon" aria-hidden="true"></i>
    </a>

    <span th:each="tag : ${tt.assigned}" class="tag-chip" th:classappend="${tag.color != null} ? 'colored'" th:style="${tag.style}">
        <span class="tag-dot" th:if="${tag.color != null}" aria-hidden="true"></span>
        <a th:href="@{/tags/{id}(id=${tag.id})}" th:text="${tag.name}">comfort watch</a>
        <form th:action="@{/tags/{id}/unassign(id=${tag.id})}" method="post" th:data-confirm="#{tags.remove.confirm(${tag.name})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="mediaType" th:value="${mediaType}" />
            <input type="hidden" name="mediaId" th:value="${mediaId}" />
            <input type="hidden" name="tmdbId" th:value="${tmdbId}" />
            <button type="submit" th:title="#{tags.remove(${tag.name})}" th:aria-label="#{tags.remove(${tag.name})}">
                <i data-lucide="x" aria-hidden="true"></i>
            </button>
        </form>
    </span>

    <form th:action="@{/tags/assign}" method="post" class="title-tags-add">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="mediaType" th:value="${mediaType}" />
        <input type="hidden" name="mediaId" th:value="${mediaId}" />
        <input type="hidden" name="tmdbId" th:value="${tmdbId}" />
        <input type="text" name="name" required maxlength="40" autocomplete="off" list="title-tag-suggestions"
               th:placeholder="#{tags.add.placeholder}" th:aria-label="#{tags.add.placeholder}">
        <datalist id="title-tag-suggestions">
            <option th:each="tag : ${tt.suggestions}" th:value="${tag.name}"></option>
        </datalist>
        <button type="submit" th:title="#{tags.add}" th:aria-label="#{tags.add}">
            <i data-lucide="plus" aria-hidden="true"></i>
        </button>
    </form>
</section>

</body>
</html>
