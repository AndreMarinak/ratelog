<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<!--/*
  Fork: "Suggested for this list" under your own list (user request 2026-11-23, Spotify's "Recommended songs" under a
  playlist). Rows and tiles reuse home.css and the quick actions of fragments/tile-actions.html; the skeleton is
  Discover's. The list page renders only `placeholder`; static/list-suggest.js fetches `row` from
  /list/{id}/suggestions once the placeholder nears the viewport, and again for "More suggestions".

  Placeholder (list-detail.html, after #listRegion):
    <th:block th:replace="~{fragments/list-suggest :: placeholder(${list}, ${isOwner}, ${listProgress}, ${listOrder})}"></th:block>
  Only on your own list with titles in it, and not in Edit order (reorder) or tick-off mode.
  Row: `listSuggest` is an org.ratelog.customlist.suggest.web.ListSuggestView, or null (renders nothing).
*/-->
<th:block th:fragment="placeholder(list, isOwner, progress, order)"
          th:if="${list != null and isOwner == true and !#lists.isEmpty(list.items) and order?.reordering != true and progress?.tick != true}">
    <!--/* Outside the section: the section is swapped out, and its styles must stay. */-->
    <link rel="stylesheet" href="/discover.css">
    <link rel="stylesheet" href="/list-suggest.css">
    <script src="/list-suggest.js" defer></script>
    <!--/* Without JS nothing would ever replace the skeleton. */-->
    <noscript><style>.list-suggest.is-pending { display: none; }</style></noscript>
    <section class="list-suggest is-pending" th:data-src="|/list/${list.id.value}/suggestions|"
             th:data-list-id="${list.id.value}" aria-busy="true" th:aria-label="#{list.suggest.aria}">
        <div class="home-row list-suggest-row" aria-hidden="true">
            <div class="home-row-head"><span class="list-suggest-skeleton-heading"></span></div>
            <div class="home-row-track">
                <div th:each="i : ${#numbers.sequence(1, 8)}" class="discover-skeleton">
                    <div class="discover-skeleton-poster"></div>
                    <span class="discover-skeleton-line"></span>
                    <span class="list-suggest-skeleton-button"></span>
                </div>
            </div>
        </div>
    </section>
</th:block>

<th:block th:fragment="row">
    <section th:if="${listSuggest != null}" class="list-suggest" data-list-suggest th:data-list-id="${listSuggest.listId}"
             th:aria-label="#{list.suggest.aria}"
             th:attr="data-label-added=#{list.suggest.added.label},data-label-error=#{list.suggest.error.load}">
        <div class="home-row list-suggest-row" id="list-suggest" aria-labelledby="list-suggest-title">
            <div class="home-row-head">
                <div class="list-suggest-head">
                    <h2 id="list-suggest-title" th:text="#{list.suggest.title}">Suggested for this list</h2>
                    <p class="list-suggest-basis" th:text="${listSuggest.basis}">Based on the 10 titles in this list</p>
                </div>
                <!--/* The label is "More" on phones; the accessible name is always the long one (it contains "More"). */-->
                <button th:if="${listSuggest.hasMore}" type="button" class="list-suggest-refresh" data-suggest-more
                        th:title="#{list.suggest.more.title}" th:aria-label="#{list.suggest.more}">
                    <i data-lucide="refresh-cw" aria-hidden="true"></i>
                    <span class="list-suggest-refresh-long" th:text="#{list.suggest.more}">More suggestions</span>
                    <span class="list-suggest-refresh-short" th:text="#{list.suggest.more.short}">More</span>
                </button>
                <button th:if="${listSuggest.canRestart and !listSuggest.exhausted}" type="button" class="list-suggest-refresh"
                        data-suggest-restart>
                    <i data-lucide="rotate-ccw" aria-hidden="true"></i>
                    <span th:text="#{list.suggest.restart}">Start over</span>
                </button>
                <div th:unless="${listSuggest.exhausted}" class="home-row-arrows">
                    <button type="button" data-row-prev th:aria-label="#{home.row.scroll.back}" disabled>
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                    </button>
                    <button type="button" data-row-next th:aria-label="#{home.row.scroll.forward}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div th:if="${listSuggest.exhausted}" class="list-suggest-end">
                <p th:text="#{list.suggest.end}">That's all the suggestions for now.</p>
                <button type="button" class="list-suggest-refresh" data-suggest-restart>
                    <i data-lucide="rotate-ccw" aria-hidden="true"></i>
                    <span th:text="#{list.suggest.restart}">Start over</span>
                </button>
            </div>

            <div th:unless="${listSuggest.exhausted}" class="home-row-track" tabindex="0" data-suggest-track
                 th:aria-label="#{list.suggest.title}">
                <div th:each="tile : ${listSuggest.tiles}" class="home-tile-wrap list-suggest-tile"
                     th:classappend="${tile.series} ? 'is-series' : ''"
                     th:attr="data-key=${tile.key},data-suggest-key=${tile.skipKey}">
                    <a class="home-tile" th:href="${tile.href}">
                        <div class="home-poster">
                            <img th:if="${tile.posterUrl != null}" th:src="${tile.posterUrl}"
                                 th:srcset="${tile.posterUrl + ' 342w, ' + tile.posterUrl2x + ' 500w'}"
                                 sizes="(max-width: 900px) 31vw, 152px" alt="" loading="lazy" decoding="async">
                            <div th:unless="${tile.posterUrl != null}" class="poster-fallback" th:text="${tile.initial}">?</div>
                            <span th:replace="~{fragments/tile-actions :: upcoming(${tile.actions})}"></span>
                            <span th:if="${tile.userScore != null}" class="home-score" th:title="#{home.your.score}"
                                  th:text="${tile.userScore}">8.5</span>
                        </div>
                        <span class="home-tile-title" th:text="${tile.title}">Title</span>
                        <span class="home-tile-meta" th:text="${tile.meta}">1999</span>
                    </a>
                    <!--/* Watchlist bookmark + Seen eye, beside the link; tile-actions.js posts them in place. */-->
                    <div th:replace="~{fragments/tile-actions :: actions(${tile.actions}, ${tile.title})}"></div>
                    <!--/* "Not interested": hidden from this list's suggestions for the session (list-suggest.js). */-->
                    <button type="button" class="list-suggest-dismiss" data-suggest-dismiss
                            th:title="#{list.suggest.dismiss}" th:aria-label="#{list.suggest.dismiss.aria(${tile.title})}">
                        <i data-lucide="x" aria-hidden="true"></i>
                    </button>
                    <!--/* "+ Add": in place with JS (list-suggest.js), a plain form post back to the list without. */-->
                    <form class="list-suggest-add" method="post" th:action="${listSuggest.addAction}" data-suggest-add>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="tmdbId" th:value="${tile.tmdbId}" />
                        <input type="hidden" name="type" th:value="${tile.type}" />
                        <input type="hidden" name="back" th:value="${listSuggest.back}" />
                        <button type="submit" th:aria-label="#{list.suggest.add.aria(${tile.title})}">
                            <i data-lucide="plus" aria-hidden="true"></i>
                            <span th:text="#{list.suggest.add}">Add</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>
