<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<header class="site-header" th:fragment="nav(active)"
        th:with="signedIn=${#authentication.isAuthenticated() and #authentication.name != 'anonymousUser'},
                 inMenu=${active == 'tags' or active == 'community' or active == 'profile' or active == 'admin' or active == 'account-add'}"
        th:classappend="${signedIn} ? 'signed-in' : ''">
    <div class="nav-brand" th:with="appName=#{app.name}">
        <a href="/" class="nav-monogram" th:aria-label="#{nav.brand.label(${appName})}">
            <img src="/img/logo.svg" alt="">
            <span class="nav-wordmark" th:text="${appName}" aria-hidden="true">Ratelog</span>
        </a>
    </div>

    <nav class="nav-links" th:if="${signedIn}" th:aria-label="#{nav.menu.main}">
        <a class="nav-link" href="/ratings" th:text="#{nav.ratings}" th:classappend="${active == 'movies' or active == 'tvshows' or active == 'ratings'} ? 'active' : ''">Ratings</a>
        <a class="nav-link" href="/discover" th:text="#{nav.discover}" th:classappend="${active == 'browse' or active == 'discover'} ? 'active' : ''">Discover</a>
        <a class="nav-link" href="/watchlist" th:text="#{nav.watchlist}" th:classappend="${active == 'watchlist'} ? 'active' : ''">Watchlist</a>
        <a class="nav-link" href="/lists" th:text="#{nav.lists}" th:classappend="${active == 'lists'} ? 'active' : ''">Lists</a>
        <a th:if="${tagsEnabled}" class="nav-link" href="/tags" th:text="#{nav.tags}" th:classappend="${active == 'tags'} ? 'active' : ''">Tags</a>
        <a class="nav-link" href="/community" th:text="#{nav.community}" th:classappend="${active == 'community'} ? 'active' : ''">Community</a>
    </nav>

    <!-- Fork: in-place saves for small actions (inplace.js / inplace.css), see docs/design-decisions.md. -->
    <link rel="stylesheet" href="/inplace.css">
    <script src="/inplace.js" defer></script>
    <!-- Fork: back links on title pages (back-nav.js remembers the page you came from), see docs/design-decisions.md. -->
    <th:block th:replace="~{fragments/back-nav :: page(${backNavPage})}"></th:block>

    <!-- Fork: header search on every page (GET / ?q=, the existing results page). "/" focuses it (nav.js). -->
    <form class="nav-search" th:if="${signedIn}" action="/" method="get" role="search">
        <label for="navSearchInput" class="visually-hidden" th:text="#{search.btn}">Search</label>
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="navSearchInput" name="q" type="search" autocomplete="off" enterkeyhint="search"
               th:value="${active == 'search' and param.q != null} ? ${param.q[0]} : ''"
               th:placeholder="#{nav.search.placeholder}" placeholder="Search movies & TV…">
        <input th:if="${active == 'search' and param.mediaType != null and !#strings.isEmpty(param.mediaType[0])}"
               type="hidden" name="mediaType" th:value="${param.mediaType[0]}">
        <kbd class="nav-search-key" aria-hidden="true">/</kbd>
    </form>

    <div class="nav-auth" th:if="${signedIn}">
        <a href="/profile" class="nav-link btn" th:classappend="${active == 'profile'} ? 'active' : ''"
           th:aria-label="#{nav.profile}" th:title="#{nav.profile}">
            <i data-lucide="user" aria-hidden="true"></i>
        </a>
        <a href="/admin/configuration" class="nav-link btn"
           th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''SUPERADMIN'')')}"
           th:classappend="${active == 'admin'} ? 'active' : ''"
           th:aria-label="#{admin.title}" th:title="#{admin.title}">
            <i data-lucide="settings" aria-hidden="true"></i>
        </a>
        <a href="/accounts/new" class="nav-link btn"
           th:if="${#authorization.expression('hasRole(''MANAGER'')')}"
           th:classappend="${active == 'account-add'} ? 'active' : ''"
           th:aria-label="#{account.add.title}" th:title="#{account.add.title}">
            <i data-lucide="user-plus" aria-hidden="true"></i>
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-link" th:aria-label="#{auth.logout}" th:title="#{auth.logout}">
                <i data-lucide="log-out" aria-hidden="true"></i>
            </button>
        </form>
    </div>

    <!-- Mobile: opens the sheet below (Discover, Tags, Community, profile, admin, logout). -->
    <button class="nav-menu-btn" id="btnNavSettings" type="button" th:if="${signedIn}"
            th:classappend="${inMenu} ? 'active' : ''"
            th:aria-label="#{nav.menu}" aria-expanded="false" aria-controls="navSettingsSheet">
        <i data-lucide="menu" aria-hidden="true"></i>
    </button>

    <nav class="bottom-nav" th:if="${signedIn}" th:aria-label="#{nav.menu.bottom}">
        <a class="bottom-nav-item bottom-nav-home" href="/" th:aria-label="#{nav.home}" th:classappend="${active == 'search'} ? 'active' : ''">
            <img src="/img/logo.svg" alt="">
        </a>
        <a class="bottom-nav-item" href="/ratings" th:aria-label="#{nav.ratings}" th:classappend="${active == 'movies' or active == 'tvshows' or active == 'ratings'} ? 'active' : ''">
            <i data-lucide="star" aria-hidden="true"></i>
        </a>
        <a class="bottom-nav-item" href="/discover" th:aria-label="#{nav.discover}" th:classappend="${active == 'browse' or active == 'discover'} ? 'active' : ''">
            <i data-lucide="compass" aria-hidden="true"></i>
        </a>
        <a class="bottom-nav-item" href="/watchlist" th:aria-label="#{nav.watchlist}" th:classappend="${active == 'watchlist'} ? 'active' : ''">
            <i data-lucide="bookmark" aria-hidden="true"></i>
        </a>
        <a class="bottom-nav-item" href="/lists" th:aria-label="#{nav.lists}" th:classappend="${active == 'lists'} ? 'active' : ''">
            <i data-lucide="library-big" aria-hidden="true"></i>
        </a>
    </nav>

    <div class="nav-sheet-backdrop" id="navSheetBackdrop" th:if="${signedIn}" hidden></div>

    <div class="nav-sheet" id="navSettingsSheet" role="dialog" aria-modal="true" th:if="${signedIn}" th:aria-label="#{nav.menu}" hidden>
        <button class="nav-sheet-close" id="btnNavSettingsClose" type="button" th:aria-label="#{modal.close}">
            <i data-lucide="x" aria-hidden="true"></i>
        </button>
        <a th:if="${tagsEnabled}" class="nav-sheet-item" href="/tags" th:classappend="${active == 'tags'} ? 'active' : ''">
            <i data-lucide="tags" aria-hidden="true"></i>
            <span th:text="#{nav.tags}">Tags</span>
        </a>
        <a class="nav-sheet-item" href="/community" th:classappend="${active == 'community'} ? 'active' : ''">
            <i data-lucide="users" aria-hidden="true"></i>
            <span th:text="#{nav.community}">Community</span>
        </a>
        <div class="nav-sheet-divider" role="separator"></div>
        <a class="nav-sheet-item" href="/profile" th:classappend="${active == 'profile'} ? 'active' : ''">
            <i data-lucide="user" aria-hidden="true"></i>
            <span th:text="#{nav.profile}">Profile</span>
        </a>
        <a class="nav-sheet-item" href="/admin/configuration"
           th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''SUPERADMIN'')')}"
           th:classappend="${active == 'admin'} ? 'active' : ''">
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
            <span th:text="#{admin.title}">Configuration</span>
        </a>
        <a class="nav-sheet-item" href="/accounts/new"
           th:if="${#authorization.expression('hasRole(''MANAGER'')')}"
           th:classappend="${active == 'account-add'} ? 'active' : ''">
            <i data-lucide="user-plus" aria-hidden="true"></i>
            <span th:text="#{account.add.title}">Add account</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <button class="nav-sheet-item" type="submit">
                <i data-lucide="log-out" aria-hidden="true"></i>
                <span th:text="#{auth.logout}">Logout</span>
            </button>
        </form>
    </div>
</header>
</body>
</html>
