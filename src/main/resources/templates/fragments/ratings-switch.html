<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<!--
    Fork: the Movies | TV Shows switch that joins the two ranking pages under one "Ratings" tab.
    Included once at the top of movies.html and tvshows.html; the filters below it stay per page (ratings-filters.js
    makes them apply on change, with an ✕ per filter).
-->
<nav th:fragment="ratingsSwitch(current)" class="ratings-switch" th:aria-label="#{ratings.switch.aria}">
    <link rel="stylesheet" href="/ratings.css">
    <!--/* Filters apply on change and get an ✕ each (fork, 2026-11-23); the label's {0} is filled in by the script. */-->
    <script src="/ratings-filters.js" defer th:data-clear-label="#{ratings.filters.clear}"></script>
    <link rel="stylesheet" href="/ratings-unrated.css">
    <!--/* Fork (2026-11-23): the three links load their page but replace this history entry (data-view-replace,
           view-swap.js), so switching Movies / TV / To rate never adds a Back step. */-->
    <script src="/view-swap.js" defer></script>
    <a href="/movies" data-view-replace class="ratings-switch-link" th:classappend="${current == 'movies'} ? 'active' : ''"
       th:attr="aria-current=${current == 'movies'} ? 'page' : null">
        <i data-lucide="film" aria-hidden="true"></i>
        <span th:text="#{nav.movies}">Movies</span>
    </a>
    <a href="/tvshows" data-view-replace class="ratings-switch-link" th:classappend="${current == 'tvshows'} ? 'active' : ''"
       th:attr="aria-current=${current == 'tvshows'} ? 'page' : null">
        <i data-lucide="tv" aria-hidden="true"></i>
        <span th:text="#{nav.tvshows}">TV Shows</span>
    </a>
    <!--/* Fork (tile rating): "Seen, not rated" (/ratings/unrated), with how many are waiting (UnratedSeenCountAdvice). */-->
    <a href="/ratings/unrated" data-view-replace class="ratings-switch-link ratings-switch-unrated" th:classappend="${current == 'unrated'} ? 'active' : ''"
       th:attr="aria-current=${current == 'unrated'} ? 'page' : null"
       th:title="#{unrated.switch.title}">
        <i data-lucide="star" aria-hidden="true"></i>
        <span th:text="#{unrated.switch}">To rate</span>
        <span class="ratings-switch-count" data-ratings-unrated-count
              th:hidden="${unratedSeenCount == null or unratedSeenCount == 0}"
              th:text="${unratedSeenCount}">12</span>
    </a>
</nav>
</body>
</html>
