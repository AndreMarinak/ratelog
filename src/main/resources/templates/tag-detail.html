<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(${tag != null} ? ${tag.name} : #{tags.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='profile')}"></header>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

    <a th:href="@{/tags}" class="link secondary flex gap centered tag-back">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span th:text="#{tags.back}">All tags</span>
    </a>

    <div th:if="${tag != null}">
        <div class="flex separate centered gap-lg">
            <h1 class="flex gap centered tag-heading" th:style="${tag.style}">
                <span class="tag-dot" th:if="${tag.color != null}" aria-hidden="true"></span>
                <span th:text="${tag.name}">comfort watch</span>
            </h1>
            <span class="text-soft" th:text="#{tags.count(${tag.titleCount})}">3 titles</span>
        </div>

        <div th:if="${#lists.isEmpty(titles)}" class="empty-state" th:text="#{tags.detail.empty}">No titles with this tag yet.</div>

        <div class="list-grid">
            <div th:each="item : ${titles}" class="list-card">
                <a th:href="${item.href}" class="poster-frame">
                    <span class="type-tag" th:if="${item.mediaType == 'movie'}" th:title="#{search.type.movie}"><i data-lucide="film" aria-hidden="true"></i></span>
                    <span class="type-tag" th:unless="${item.mediaType == 'movie'}" th:title="#{search.type.tv}"><i data-lucide="tv" aria-hidden="true"></i></span>
                    <img th:if="${item.posterPath != null}" th:src="@{'https://image.tmdb.org/t/p/w342' + ${item.posterPath}}" th:srcset="|https://image.tmdb.org/t/p/w342${item.posterPath} 1x, https://image.tmdb.org/t/p/w500${item.posterPath} 2x|" th:alt="'Poster of ' + ${item.title}">
                    <div th:unless="${item.posterPath != null}" class="poster-fallback" th:text="${#strings.toUpperCase(#strings.substring(item.title, 0, 1))}">?</div>
                </a>
                <div class="list-content gap">
                    <a th:href="${item.href}" class="link">
                        <h3>
                            <span th:text="${item.title}">Title</span>
                            <span class="year" th:text="${item.year != null} ? ${item.year} : #{movies.year.unknown}">Year</span>
                        </h3>
                    </a>
                    <div class="flex gap centered">
                        <span th:if="${item.score != null}" class="rating sm" th:title="#{tags.your.score}"
                              th:text="${#strings.replace(#numbers.formatDecimal(item.score, 1, 2), ',', '.')}">8.40</span>
                        <form th:action="@{/tags/{id}/unassign(id=${tag.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="mediaType" th:value="${item.mediaType}" />
                            <input type="hidden" name="mediaId" th:value="${item.mediaId}" />
                            <button type="submit" th:title="#{tags.remove(${tag.name})}" th:aria-label="#{tags.remove(${tag.name})}">
                                <i data-lucide="x" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style th:replace="~{fragments/tags :: tagStyles}"></style>
<style>
    .tag-back { display: inline-flex; margin-bottom: 12px; }
    .tag-back svg { width: 18px; height: 18px; }
    .tag-heading { overflow-wrap: anywhere; }
    .tag-heading .tag-dot { width: 14px; height: 14px; }
</style>
</body>
</html>
