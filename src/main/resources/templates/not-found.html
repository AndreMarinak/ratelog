<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{notfound.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <!--/* th:block wrapper: th:replace on the same element would run before th:if. */-->
    <th:block th:if="${#authorization.expression('isAuthenticated()')}">
        <header class="site-header" th:replace="~{fragments/nav :: nav(active='none')}"></header>
    </th:block>

    <h1 th:text="#{notfound.title}">Page not found</h1>
    <p class="help-text" th:text="#{notfound.help}">This page doesn't exist, or the link is wrong.</p>
    <p><a href="/" class="link" th:text="#{notfound.home}">Go to Home</a></p>
</div>
</body>
</html>
