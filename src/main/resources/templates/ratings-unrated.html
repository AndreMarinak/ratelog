<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{unrated.page.title})}"></head>
<body>
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='movies')}"></header>
    <link rel="stylesheet" href="/home.css">
    <link rel="stylesheet" href="/search-results.css">
    <link rel="stylesheet" href="/tile-actions.css">

    <h1 th:text="#{ratings.title}">Ratings</h1>
    <nav th:replace="~{fragments/ratings-switch :: ratingsSwitch('unrated')}"></nav>

    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>
    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>

    <!--/* Fork: "Seen, not rated" (UnratedSeenController). Every tile has the poster quick actions: ★ rates a movie in
           place and the tile leaves this view (static/ratings-unrated.js); a show's ★ opens its seasons.
           Fork (2026-11-23): the All / Movies / TV tabs switch in place (view-swap.js, loaded by the ratings switch:
           data-view + data-view-links), replacing the URL, so they add no Back step. */-->
    <section th:fragment="view" id="unratedView" class="unrated" data-unrated data-view data-view-fallback="type" th:with="u=${unrated}">
        <p class="unrated-intro" th:text="#{unrated.intro}">Titles you marked seen but haven't rated yet, newest first.</p>
        <nav class="unrated-tabs" data-view-links="type" th:aria-label="#{unrated.tabs.aria}">
            <a th:each="tab : ${u.tabs}" th:href="${tab.href}" class="unrated-tab" th:classappend="${tab.active} ? 'active' : ''"
               th:attr="aria-current=${tab.active} ? 'page' : null,data-unrated-tab=${tab.type}">
                <span th:text="#{${tab.labelKey}}">All</span>
                <span class="unrated-tab-count" data-unrated-count th:text="${tab.count}">12</span>
            </a>
        </nav>

        <div class="empty-state unrated-empty" data-unrated-empty th:hidden="${u.emptyKey == null}"
             th:text="${u.emptyKey != null} ? #{${u.emptyKey}} : #{unrated.empty}">Nothing to rate: everything you've seen has a rating.</div>

        <div class="search-grid unrated-grid" th:unless="${#lists.isEmpty(u.tiles)}">
            <div th:each="tile : ${u.tiles}" class="home-tile-wrap search-tile-wrap" th:attr="data-unrated-type=${tile.isMovie} ? 'movie' : 'tv'">
                <a th:href="${tile.href}" class="home-tile search-tile">
                    <div class="home-poster">
                        <img th:if="${tile.posterUrl != null}" th:src="${tile.posterUrl}"
                             th:srcset="${tile.posterUrl + ' 342w, ' + tile.posterUrl2x + ' 500w'}"
                             sizes="(max-width: 600px) 31vw, 170px" alt="" loading="lazy" decoding="async">
                        <div th:unless="${tile.posterUrl != null}" class="poster-fallback" th:text="${tile.initial}">?</div>
                        <span class="home-type" th:title="${tile.isMovie} ? #{search.type.movie} : #{search.type.tv}">
                            <i th:data-lucide="${tile.isMovie} ? 'film' : 'tv'" aria-hidden="true"></i>
                        </span>
                        <span th:replace="~{fragments/tile-actions :: upcoming(${tile.actions})}"></span>
                    </div>
                    <span class="home-tile-title" th:text="${tile.title}" th:title="${tile.title}">Title</span>
                    <span class="home-tile-meta" th:text="${tile.year != null} ? ${tile.year} : #{movies.year.unknown}">2024</span>
                </a>
                <div th:replace="~{fragments/tile-actions :: actions(${tile.actions}, ${tile.title})}"></div>
            </div>
        </div>
    </section>
</div>
<script src="/tile-actions.js" defer></script>
<th:block th:replace="~{fragments/tile-rate :: assets}"></th:block>
<script src="/ratings-unrated.js" defer></script>
</body>
</html>
