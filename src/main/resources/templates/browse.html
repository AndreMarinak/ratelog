<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{browse.title})}"></head>
<body>
<link rel="stylesheet" href="/browse.css">
<div th:replace="~{fragments/loader}"></div>
<div class="page">
    <header class="site-header" th:replace="~{fragments/nav :: nav(active='browse')}"></header>

    <div class="browse-head">
        <h1 th:text="#{browse.title}">Browse</h1>
        <p class="browse-subtitle" th:text="#{browse.subtitle}">Explore TMDB by year, rating, genre, service and more.</p>
    </div>

    <div th:if="${success}" class="feedback success" th:text="#{${success}}"></div>
    <div th:if="${error}" class="feedback error" th:text="#{${error}}"></div>

    <div th:replace="~{fragments/browse-bar :: browseBar(browseBar=${browseBar})}"></div>

    <!-- `partial=1` renders only this section; browse.js appends its tiles and swaps in its "Load more". -->
    <section th:fragment="results" class="browse-results" id="browseResults" th:aria-label="#{browse.results.aria}">
        <p class="browse-note" th:if="${ignoredNote}">
            <i data-lucide="info" aria-hidden="true"></i>
            <span th:text="#{browse.note.week}">Trending this week can't be narrowed by service or runtime.</span>
        </p>

        <div th:if="${errorKey != null}" class="browse-message" role="alert">
            <i data-lucide="triangle-alert" aria-hidden="true"></i>
            <span th:text="#{${errorKey}}">Couldn't reach TMDB right now.</span>
            <a class="btn secondary" th:href="${retryHref}" th:text="#{browse.retry}">Try again</a>
        </div>

        <div th:if="${errorKey == null and #lists.isEmpty(tiles)}" class="empty-state" th:text="#{browse.empty}">Nothing matches these filters.</div>

        <ul class="browse-grid" id="browseGrid">
            <li th:each="tile : ${tiles}" class="browse-tile" th:attr="data-key=${tile.key}">
                <a th:href="${tile.href}" class="browse-tile-link">
                    <div class="browse-poster">
                        <img th:if="${tile.posterUrl != null}" th:src="${tile.posterUrl}" th:alt="${tile.title}" loading="lazy">
                        <div th:unless="${tile.posterUrl != null}" class="poster-fallback" aria-hidden="true" th:text="${tile.initial}">?</div>
                        <span th:if="${tile.statusIcon != null}" class="browse-status" th:title="${tile.statusLabel}">
                            <i th:data-lucide="${tile.statusIcon}" aria-hidden="true"></i>
                            <span class="visually-hidden" th:text="${tile.statusLabel}">Watched</span>
                        </span>
                        <span th:if="${tile.userScore != null}" class="browse-user-score" th:title="#{browse.your.score}">
                            <span class="visually-hidden" th:text="#{browse.your.score}">Your score</span>
                            <span th:text="${tile.userScore}">8.4</span>
                        </span>
                    </div>
                    <div class="browse-tile-meta">
                        <span class="browse-tile-title" th:text="${tile.title}">Title</span>
                        <span class="browse-tile-sub">
                            <span th:text="${tile.year != null} ? ${tile.year} : #{movies.year.unknown}">2019</span>
                            <span th:if="${tile.tmdbScore != null}" class="browse-tmdb" th:title="#{browse.tmdb.score}">
                                <i data-lucide="star" aria-hidden="true"></i><span th:text="${tile.tmdbScore}">7.8</span>
                            </span>
                        </span>
                    </div>
                </a>
                <!--/* One-click "Want to watch". A sibling of the link (never inside it); browse.js submits it in place. */-->
                <form class="browse-bookmark" method="post" action="/watchlist/toggle"
                      th:classappend="${tile.onWatchlist} ? 'is-on' : ''"
                      th:attr="data-status=${tile.status},data-label-add=#{watchlist.quick.add},data-label-remove=#{watchlist.quick.remove}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="tmdbId" th:value="${tile.tmdbId}">
                    <input type="hidden" name="type" th:value="${tile.type}">
                    <button type="submit" class="browse-bookmark-btn"
                            th:with="label=${tile.onWatchlist} ? #{watchlist.quick.remove} : #{watchlist.quick.add}"
                            th:aria-label="${label}" th:title="${label}">
                        <i th:data-lucide="${tile.onWatchlist} ? 'bookmark-check' : 'bookmark'" aria-hidden="true"></i>
                    </button>
                </form>
            </li>
        </ul>

        <div class="browse-more" id="browseMore"
             th:attr="data-loading=#{browse.loading},data-error=#{browse.error.unreachable},data-retry=#{browse.retry}">
            <a th:if="${nextHref != null}" class="browse-load-more" th:href="${nextHref}" data-load-more>
                <span th:text="#{browse.load.more}">Load more</span>
                <i data-lucide="chevron-down" aria-hidden="true"></i>
            </a>
            <a th:if="${firstPageHref != null}" class="browse-first" th:href="${firstPageHref}">
                <i data-lucide="arrow-left" aria-hidden="true"></i>
                <span th:text="#{browse.first.page}">Back to the first page</span>
            </a>
        </div>
    </section>
    <div class="browse-toast" id="browseToast" role="status" aria-live="polite"></div>
</div>
<script src="/browse.js" defer></script>
</body>
</html>
