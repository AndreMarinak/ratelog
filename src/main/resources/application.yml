spring:
  application:
    name: ratelog
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ratelog}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Fork migrations are numbered V1000+; allow upstream's lower-numbered ones to apply later.
    out-of-order: true

server:
  port: ${PORT:8080}
  # Behind Railway's TLS proxy: honor X-Forwarded-* so redirects use https.
  forward-headers-strategy: framework
  servlet:
    context-path: /

ratelog:
  features:
    # Fork: tags are hidden in the web UI for now (code, /tags pages and the API stay). RATELOG_FEATURES_TAGS=true shows them.
    tags: false
  tmdb:
    base-url: https://api.themoviedb.org/3